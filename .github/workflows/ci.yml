name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --------------------------------------------------------
  # VALIDACIÓN DEL BACKEND (Python / FastAPI)
  # --------------------------------------------------------
  backend-checks:
    name: Backend Checks 🐍
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Smoke Test (Verificar imports de FastAPI)
        # Verifica que la API carga correctamente sin errores de sintaxis
        run: |
          python -c "from api import app; print('✅ El backend compila e importa correctamente')"
          
      - name: Ejecutar pruebas (Pytest)
        run: |
          pip install pytest httpx
          pytest tests/

  # --------------------------------------------------------
  # VALIDACIÓN DEL FRONTEND (Node / React / Vite)
  # --------------------------------------------------------
  frontend-checks:
    name: Frontend Checks ⚛️
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
        
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Instalar dependencias (Frontend)
        run: npm ci || npm install
        
      - name: Ejecutar Linter (ESLint)
        run: npm run lint
        
      - name: Verificar Build (Vite)
        run: npm run build
